<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Your Password</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            padding: 30px;
            text-align: center;
        }

        .content {
            padding: 40px;
            text-align: center;
        }

        .otp {
            font-size: 32px;
            font-weight: 700;
            color: #3b82f6;
            letter-spacing: 5px;
            margin: 24px 0;
            padding: 20px;
            background: rgba(59, 130, 246, 0.1);
            border-radius: 8px;
            border: 1px dashed #3b82f6;
            display: inline-block;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 12px;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>ProDesX HRMS</h2>
        </div>
        <div class="content">
            <h3 style="margin-top: 0;">Hello {{NAME}},</h3>
            <p>We received a request to reset your password. Use the verification code below to proceed:</p>
            <div class="otp">{{OTP}}</div>
            <p>This code is valid for 10 minutes. If you did not request a password reset, please ignore this email.</p>
        </div>
        <div class="footer">
            &copy; 2026 ProDesX HRMS. All rights reserved.
        </div>
    </div>
</body>

</html>
